<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 450" width="1100" height="450" role="img">

<style>
  svg { background: transparent; }
  text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e6edf3; font-size: 15px; }
  .title { font-size: 22px; font-weight: 700; fill: #ffffff; }
  .small { font-size: 12px; fill: #9fb0c0; }
  .box { fill: #111827; stroke: #5b6ee1; stroke-width: 2; rx: 14; }
  .zone { fill: #0b1220; stroke: #334155; stroke-width: 2; rx: 18; }
  .danger { fill: #3b1111; stroke: #ff6666; stroke-width: 2; rx: 14; }
  .green { stroke: #4ade80; }
  .orange { stroke: #fb923c; }
  .muted { stroke: #64748b; }
  .arrow { stroke: #9fb0c0; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  .dash { stroke-dasharray: 6 5; }
</style>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#9fb0c0" />
  </marker>
</defs>

<text x="40" y="44" class="title">Deployment ownership</text>
<rect x="60" y="100" width="260" height="100" class="box green"/>
<text x="78" y="130" class="title">wan0net/juni-setup</text>
<text x="78" y="158" class="small">VM bootstrap docs</text>
<text x="78" y="178" class="small">safe readable backup</text>
<rect x="60" y="290" width="260" height="100" class="box orange"/>
<text x="78" y="320" class="title">wan0net/docker-compose</text>
<text x="78" y="348" class="small">Komodo stack: juni/</text>
<text x="78" y="368" class="small">no raw secrets</text>
<rect x="430" y="95" width="250" height="110" class="box"/>
<text x="448" y="125" class="title">Juni VM</text>
<text x="448" y="153" class="small">Hermes core</text>
<text x="448" y="173" class="small">tools</text>
<text x="448" y="193" class="small">state</text>
<rect x="430" y="285" width="250" height="110" class="box"/>
<text x="448" y="315" class="title">Komodo</text>
<text x="448" y="343" class="small">deploys Compose</text>
<text x="448" y="363" class="small">manages services</text>
<rect x="790" y="285" width="250" height="110" class="box"/>
<text x="808" y="315" class="title">Docker host</text>
<text x="808" y="343" class="small">WebUI</text>
<text x="808" y="363" class="small">optional sidecars</text>
<rect x="790" y="95" width="250" height="110" class="box"/>
<text x="808" y="125" class="title">Juni WebUI</text>
<text x="808" y="153" class="small">private API back to VM</text>
<text x="808" y="173" class="small">browser workbench</text>
<path d="M320,135 C375.0,135 375.0,135 430,135" class="arrow"/>
<path d="M320,340 C375.0,340 375.0,340 430,340" class="arrow"/>
<path d="M680,340 C735.0,340 735.0,340 790,340" class="arrow"/>
<path d="M915,285 C915.0,285 915.0,205 915,205" class="arrow"/>
